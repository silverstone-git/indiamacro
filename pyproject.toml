[project]
name = "indiamacro"
version = "0.1.0"
description = "India-first access to free macroeconomic data: MoSPI, RBI, Union Budget, plus FRED, World Bank, IMF, OECD, BIS, Penn World Table and Our World in Data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
indiamacro-ping = "indiamacro.ping:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["live: hits real data sources over the network (run with -m live)"]
addopts = "-m 'not live'"

[tool.pyright]
venvPath = "."
venv = ".venv"
